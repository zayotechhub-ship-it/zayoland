<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Zayo Tech Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="11d8e851-62d2-488e-9aaa-9eb784914266"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            accent: '#d4af37',
            panel: '#0f172a'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background:
        linear-gradient(135deg, rgba(15, 23, 42, 0.84), rgba(14, 116, 144, 0.75)),
        url('asset/banner.jpg') center/cover no-repeat fixed;
      min-height: 100vh;
    }
    .glass {
      background: rgba(15, 23, 42, 0.58);
      border: 1px solid rgba(212, 175, 55, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 25px 50px -20px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body class="font-sans text-white min-h-screen flex items-center justify-center px-4 py-10">
  <main class="w-full max-w-xl mx-auto glass rounded-[32px] p-6 sm:p-8">
    <div class="flex items-center justify-between gap-3 mb-8">
      <div class="flex items-center gap-3">
        <img src="asset/logo.png" alt="Zayo Tech Hub logo" class="w-14 h-14 rounded-full border border-white/10 object-cover" />
        <div>
          <p class="font-display text-2xl font-bold">Zayo Tech Hub</p>
          <p class="text-xs uppercase tracking-[0.18em] text-amber-200">Contact Center</p>
        </div>
      </div>
      <a href="bio_link_qr_landing_page.html" class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-white/10 transition-all">
        <i class="fa-solid fa-house"></i>
        Home
      </a>
    </div>

    <div class="rounded-3xl border border-amber-300/20 bg-amber-500/5 p-5 mb-6">
      <p class="text-xs uppercase tracking-[0.22em] text-amber-200 mb-2">Get in touch</p>
      <h1 class="font-display text-3xl sm:text-4xl font-bold leading-tight">We’d love to hear from you.</h1>
    </div>

    <div class="space-y-4">
      <a href="mailto:zayotechhub@gmail.com" class="group flex items-center justify-between rounded-2xl border border-white/10 bg-white/5 p-4 hover:bg-white/10 transition-all">
        <div class="flex items-center gap-4">
          <div class="w-11 h-11 rounded-full bg-emerald-500/15 text-emerald-300 flex items-center justify-center">
            <i class="fa-solid fa-envelope"></i>
          </div>
          <div>
            <p class="text-xs uppercase tracking-[0.18em] text-slate-400">Email</p>
            <p class="text-base font-semibold text-white">zayotechhub@gmail.com</p>
          </div>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square text-slate-400 group-hover:text-white transition-colors"></i>
      </a>

      <a href="https://www.facebook.com/zayo.techhub" target="_blank" rel="noopener noreferrer" class="group flex items-center justify-between rounded-2xl border border-white/10 bg-white/5 p-4 hover:bg-white/10 transition-all">
        <div class="flex items-center gap-4">
          <div class="w-11 h-11 rounded-full bg-blue-500/15 text-blue-300 flex items-center justify-center">
            <i class="fa-brands fa-facebook-f"></i>
          </div>
          <div>
            <p class="text-xs uppercase tracking-[0.18em] text-slate-400">Facebook</p>
            <p class="text-base font-semibold text-white">@zayo.techhub</p>
          </div>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square text-slate-400 group-hover:text-white transition-colors"></i>
      </a>

      <a href="https://zayotech.pathao.shop/" target="_blank" rel="noopener noreferrer" class="group flex items-center justify-between rounded-2xl border border-white/10 bg-white/5 p-4 hover:bg-white/10 transition-all">
        <div class="flex items-center gap-4">
          <div class="w-11 h-11 rounded-full bg-teal-500/15 text-teal-300 flex items-center justify-center">
            <i class="fa-solid fa-bag-shopping"></i>
          </div>
          <div>
            <p class="text-xs uppercase tracking-[0.18em] text-slate-400">Store</p>
            <p class="text-base font-semibold text-white">zayotech.pathao.shop</p>
          </div>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square text-slate-400 group-hover:text-white transition-colors"></i>
      </a>
    </div>

    <div class="mt-8 text-center text-sm text-slate-300">
      Business hours: <span class="font-semibold text-white">9:00 AM - 8:00 PM</span>
    </div>
  </main>
</body>
</html>
